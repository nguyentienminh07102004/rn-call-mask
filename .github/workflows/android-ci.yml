name: Android CI

on:
  push:
    branches: [master, main]
    paths:
      - 'android/**'
      - 'example/android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'example/android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android source
        id: android
        shell: bash
        run: |
          if [[ -d android || -d example/android ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Android source not present yet; native validation is bootstrap-skipped."
          fi

      - name: Require package scaffold for native source
        if: steps.android.outputs.enabled == 'true'
        run: test -f package.json

      - name: Setup Node from .nvmrc
        if: steps.android.outputs.enabled == 'true' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup fallback Node
        if: steps.android.outputs.enabled == 'true' && hashFiles('.nvmrc') == ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        if: steps.android.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable Corepack
        if: steps.android.outputs.enabled == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.android.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --immutable
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "::error::A lockfile is required"
            exit 1
          fi

      - name: Run Android CI script
        if: steps.android.outputs.enabled == 'true'
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts?.['ci:android']) { console.error('Missing package script ci:android'); process.exit(1) }"
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm ci:android
          elif [[ -f yarn.lock ]]; then
            yarn ci:android
          else
            npm run ci:android
          fi
