name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/validate-repo.sh

      - name: Validate repository contract
        run: bash scripts/validate-repo.sh

  javascript:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    needs: repository-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect JS scaffold
        id: js
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "package.json not present yet; JS validation is bootstrap-skipped."
          fi

      - name: Setup Node from .nvmrc
        if: steps.js.outputs.enabled == 'true' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup fallback Node
        if: steps.js.outputs.enabled == 'true' && hashFiles('.nvmrc') == ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        if: steps.js.outputs.enabled == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.js.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --immutable
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "::error::A lockfile is required once package.json exists"
            exit 1
          fi

      - name: Detect package manager
        if: steps.js.outputs.enabled == 'true'
        id: pm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.js.outputs.enabled == 'true'
        run: ${{ steps.pm.outputs.run }} lint

      - name: Typecheck
        if: steps.js.outputs.enabled == 'true'
        run: ${{ steps.pm.outputs.run }} typecheck

      - name: Test
        if: steps.js.outputs.enabled == 'true'
        run: ${{ steps.pm.outputs.run }} test
