plugins {
    id 'com.android.library'
}

def safeExtGet(String property, Object fallback) {
    return rootProject.ext.has(property) ? rootProject.ext.get(property) : fallback
}

android {
    namespace 'com.rncallmask'
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 26)
        targetSdk safeExtGet('targetSdkVersion', 36)
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.core:core-telecom:1.0.1'
    compileOnly 'com.facebook.react:react-android'
    testImplementation 'junit:junit:4.13.2'
}
